plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lostomates.mascotas'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lostomates.mascotas'
        minSdk 15
        targetSdk 28
        multiDexEnabled true
        versionCode 1
        versionName '1.0'
    }
    packaging {
        resources {
            merges += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md']
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.mikhaellopez:circularimageview:3.0.2'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'com.android.support:multidex:1.0.3'
}
